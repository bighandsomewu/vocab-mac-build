name: 给 macOS 包做 ad-hoc 签名（最小流程，不装任何打包器）

# 目的：交叉打包的 .app 在 Apple 芯片上会报"已损坏"，根因是缺 ad-hoc 签名。
#       这个工作流只做一件事：下载已发布的 .app → codesign -s - → 重新打包 → 上传。
#       全程只用 macOS 自带命令（curl / unzip / codesign / zip），不装 npm 包，不触发任何下载源。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write            # 发 Release 需要写权限（新仓库默认是只读）

jobs:
  sign:
    runs-on: macos-14
    steps:
      - name: 下载已发布的 macOS 包（arm64，3 个分片）
        run: |
          set -e
          BASE="https://gitee.com/bighandsomewu/vocabulary_improvement/releases/download/macos-v1.2.3"
          NAME="%E6%95%B4%E5%8F%A5%E9%BB%98%E5%86%99%E5%99%A8-1.2.3-macOS-arm64.zip"
          for i in 1 2 3; do
            echo "下载 part$i …"
            curl -sL --retry 3 --max-time 600 -o "p$i" "$BASE/$NAME.part$i"
            ls -la "p$i"
          done
          cat p1 p2 p3 > mac.zip
          echo "拼好的 zip: $(stat -f%z mac.zip) 字节"
          test "$(stat -f%z mac.zip)" -gt 200000000

      - name: 解压
        run: |
          set -e
          unzip -q mac.zip
          ls -la
          test -d "整句默写器.app"

      - name: ad-hoc 签名（这一步就是全部目的）
        run: |
          set -e
          APP="整句默写器.app"
          echo "=== 签名前检查 ==="
          codesign -dv "$APP" 2>&1 | head -5 || echo "（当前无签名，符合预期）"
          echo "=== 执行 ad-hoc 签名 ==="
          codesign --force --deep --sign - "$APP"
          echo "=== 验证 ==="
          codesign --verify --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -8

      - name: 去掉隔离标记 + 重新打包
        run: |
          set -e
          APP="整句默写器.app"
          xattr -cr "$APP" || true
          mkdir -p dist
          zip -q -r -y "dist/整句默写器-1.2.3-macOS-arm64-已签名.zip" "$APP"
          ls -la dist/
          shasum -a 256 "dist/整句默写器-1.2.3-macOS-arm64-已签名.zip" | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed-arm64
          path: dist/*
          if-no-files-found: error

      # 关键：用 git push 把签名包推回 Gitee
      # 为什么用 git 而不是 curl：runner 的出网被 Azure 网关拦，curl 到 gitee api 会被顶回
      # InvalidAuthenticationInfo；但 git clone https://gitee.com 是通的（走另一条路），所以 push 大概率也能过。
      # 推到一个独立分支，不污染 master。之后从本机 git clone 取回。
      - name: 用 git push 把签名包推回 Gitee
        env:
          GT: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          ZIP=$(ls dist/*.zip | head -1)
          SRC="$(pwd)/$ZIP"
          echo "要推的文件: $SRC  ($(stat -f%z "$SRC") 字节)"
          rm -rf /tmp/push && mkdir -p /tmp/push && cd /tmp/push
          # 切 45MB 片（Gitee 仓库单文件上限 50MB）
          split -b 45m --numeric-suffixes=1 --suffix-length=2 "$SRC" signed.zip.part
          cp "$(dirname "$SRC")/SHA256.txt" . 2>/dev/null || true
          ls -la
          git init -q
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout -q -b macos-signed-v1.2.3
          git add -A
          git commit -q -m "macOS 已签名包 1.2.3（arm64，分片，ad-hoc 签名）"
          git remote add origin "https://bighandsomewu:${GT}@gitee.com/bighandsomewu/vocabulary_improvement.git"
          git push -q -f origin macos-signed-v1.2.3
          echo "✓ 已推到分支 macos-signed-v1.2.3"
          echo "  本机取回: git clone -b macos-signed-v1.2.3 https://gitee.com/bighandsomewu/vocabulary_improvement.git"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed-arm64
          path: dist/*
          if-no-files-found: error

      # 关键：签名结果直接传到 Gitee（这边下载快；GitHub 的产物存在 Azure，国内 0.04MB/s 下不动）
      - name: 上传到 Gitee 发行版
        env:
          GT: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          API="https://gitee.com/api/v5/repos/bighandsomewu/vocabulary_improvement"
          TAG="macos-signed-v1.2.3"
          ZIP=$(ls dist/*.zip | head -1)
          echo "要传的文件: $ZIP  ($(stat -f%z "$ZIP") 字节)"
          RID=$(curl -s -H "Authorization: Bearer $GT" "$API/releases/tags/$TAG" \
                | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -z "$RID" ]; then
            RID=$(curl -s -X POST -H "Authorization: Bearer $GT" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"macOS 已签名包 1.2.3\",\"target_commitish\":\"master\"}" \
              "$API/releases" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          fi
          echo "release id=$RID"
          mkdir -p parts && cd parts
          split -b 95m --numeric-suffixes=1 --suffix-length=1 "../$ZIP" "signed.zip.part"
          ls -la
          for f in signed.zip.part*; do
            echo "→ 上传 $f ($(stat -f%z "$f") 字节)"
            curl -s -X POST -H "Authorization: Bearer $GT" \
              -F "file=@$f;filename=$f" "$API/releases/$RID/attach_files" | head -c 150; echo
          done
          curl -s -X POST -H "Authorization: Bearer $GT" -F "file=@../dist/SHA256.txt;filename=SHA256.txt" \
            "$API/releases/$RID/attach_files" >/dev/null
          echo "✓ 已传到 Gitee: https://gitee.com/bighandsomewu/vocabulary_improvement/releases/tag/$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed-arm64
          path: dist/*
          if-no-files-found: error

      # 关键：把签名结果作为 Release 附件发出去 —— 这样国内可以用 ghfast.top 加速下载，
      # 不用再走 GitHub 的 artifacts（那个只从 Azure 走，国内极慢）。
      - name: 发布到 Release（便于国内加速下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="macos-signed-v1.2.3"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "macOS 已签名包 1.2.3" \
              --notes "ad-hoc 签名版，双击即可打开（首次若仍被拦，右键→打开）。"
          gh release upload "$TAG" dist/*.zip dist/SHA256.txt --clobber
          echo "=== 下载地址 ==="
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/整句默写器-1.2.3-macOS-arm64-已签名.zip"
          echo "（国内加速：在该地址前加 https://ghfast.top/ ）"
